<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PokeDex{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-b from-slate-50 to-slate-100 text-slate-800">
    <div id="ambient-bg" class="fixed inset-0 -z-10 pointer-events-none bg-slate-950 transition-[background,opacity] duration-700 ease-out"></div>
    <header class="sticky top-0 z-10 backdrop-blur bg-white/70 border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-tight">PokeDex</h1>
        <nav class="text-sm text-slate-600 flex items-center gap-4">
          <a href="/" class="hover:text-slate-900 transition-colors">Inicio</a>
          <a href="/favorites" class="hover:text-slate-900 transition-colors">Favoritos</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="py-8 text-center text-xs text-slate-500">
      <p>Datos por PokeAPI</p>
    </footer>

    <script>
      const FAV_KEY = 'poke_favorites_ids';
      function getFavs() {
        try {
          const v = localStorage.getItem(FAV_KEY);
          return v ? JSON.parse(v) : [];
        } catch (e) { return []; }
      }
      function setFavs(ids) {
        try { localStorage.setItem(FAV_KEY, JSON.stringify(ids)); } catch (e) {}
        document.dispatchEvent(new CustomEvent('favorites:changed', { detail: ids }));
      }
      function isFav(id) {
        const ids = getFavs();
        return ids.includes(Number(id));
      }
      function toggleFav(id) {
        id = Number(id);
        let ids = getFavs();
        if (ids.includes(id)) {
          ids = ids.filter(x => x !== id);
        } else {
          ids.push(id);
        }
        setFavs(ids);
        updateStarStates();
        return ids.includes(id);
      }
      function updateStarStates() {
        const ids = new Set(getFavs());
        document.querySelectorAll('[data-fav-btn]')?.forEach(btn => {
          const id = Number(btn.getAttribute('data-id'));
          const on = ids.has(id);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          const svg = btn.querySelector('svg');
          if (svg) {
            svg.classList.toggle('fill-yellow-400', on);
            svg.classList.toggle('fill-transparent', !on);
            svg.classList.toggle('stroke-yellow-500', on);
            svg.classList.toggle('stroke-slate-400', !on);
          }
        });
      }
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fav-btn]');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        toggleFav(id);
      });
      document.addEventListener('DOMContentLoaded', updateStarStates);
      document.addEventListener('favorites:changed', updateStarStates);

      const TYPE_COLORS = {
        normal: '#a8a29e',
        fire: '#f97316',
        water: '#0ea5e9',
        grass: '#22c55e',
        ice: '#22d3ee',
        electric: '#eab308',
        psychic: '#ec4899',
        fighting: '#ef4444',
        poison: '#a855f7',
        ground: '#eab308',
        flying: '#6366f1',
        bug: '#84cc16',
        rock: '#a16207',
        ghost: '#8b5cf6',
        steel: '#64748b',
        dragon: '#7c3aed',
        dark: '#737373',
        fairy: '#e879f9',
      };

      function updateAmbientBackground() {
        const ambient = document.getElementById('ambient-bg');
        if (!ambient) return;

        const cards = document.querySelectorAll('[data-pkm-card]');
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
        const counts = {};

        cards.forEach((card) => {
          const rect = card.getBoundingClientRect();
          if (rect.bottom <= 0 || rect.top >= viewportHeight) return;
          const typesAttr = card.getAttribute('data-types') || '';
          typesAttr
            .split(',')
            .map((t) => t.trim().toLowerCase())
            .filter(Boolean)
            .forEach((t) => {
              counts[t] = (counts[t] || 0) + 1;
            });
        });

        const entries = Object.entries(counts);
        if (!entries.length) {
          ambient.style.opacity = '0';
          return;
        }

        entries.sort((a, b) => b[1] - a[1]);
        const mainTypes = entries.slice(0, 3).map(([t]) => t);
        const palette = mainTypes.map((t) => TYPE_COLORS[t] || '#6366f1');
        const c1 = palette[0] || '#6366f1';
        const c2 = palette[1] || '#0ea5e9';
        const c3 = palette[2] || '#22c55e';

        ambient.style.opacity = '1';
        ambient.style.background = `
          radial-gradient(circle at 0% 10%, ${c1}E6, transparent 60%),
          radial-gradient(circle at 100% 0%, ${c2}E6, transparent 60%),
          radial-gradient(circle at 50% 100%, ${c3}E6, transparent 65%),
          radial-gradient(circle at 50% 0%, #020617, #020617)
        `;
      }

      let ambientTicking = false;
      function handleAmbientScroll() {
        if (ambientTicking) return;
        ambientTicking = true;
        requestAnimationFrame(() => {
          updateAmbientBackground();
          ambientTicking = false;
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        updateAmbientBackground();
        window.addEventListener('scroll', handleAmbientScroll);
        window.addEventListener('resize', handleAmbientScroll);
      });
    </script>
  </body>
</html>
