<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PokeDex{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pkm-card-ambient {
      position: relative;
      transition: box-shadow 0.3s ease, transform 0.18s ease;
      will-change: transform;
    }

    .pkm-card-ambient:hover {
      transform: translateY(-4px);
    }

    .pkm-card-stage {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at bottom, rgba(15, 23, 42, 0.16), transparent 60%),
        linear-gradient(to bottom right, #f9fafb, #e5e7eb);
    }

    .pkm-card-stage::before {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: 12%;
      height: 18%;
      border-radius: 9999px;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.25), transparent 70%);
      opacity: 0.85;
      pointer-events: none;
    }

    .pkm-type-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding-inline: 0.7rem;
      padding-block: 0.2rem;
      border-radius: 9999px;
      background-image: linear-gradient(to bottom right, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.7),
        0 6px 12px rgba(15, 23, 42, 0.08);
      font-weight: 600;
    }

    .pkm-type-chip:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.9),
        0 8px 16px rgba(15, 23, 42, 0.12);
    }

    [data-fav-btn] {
      z-index: 10;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-b from-slate-50 to-slate-100 text-slate-800">
  <header class="sticky top-0 z-10 backdrop-blur bg-white/70 border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-bold tracking-tight">PokeDex</h1>
      <nav class="text-sm text-slate-600 flex items-center gap-4">
        <a href="/" class="hover:text-slate-900 transition-colors">Inicio</a>
        <a href="/favorites" class="hover:text-slate-900 transition-colors">Favoritos</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-8 text-center text-xs text-slate-500">
    <p>Datos por PokeAPI</p>
  </footer>

  <script>
    const FAV_KEY = 'poke_favorites_ids';
    function getFavs() {
      try {
        const v = localStorage.getItem(FAV_KEY);
        return v ? JSON.parse(v) : [];
      } catch (e) { return []; }
    }
    function setFavs(ids) {
      try { localStorage.setItem(FAV_KEY, JSON.stringify(ids)); } catch (e) { }
      document.dispatchEvent(new CustomEvent('favorites:changed', { detail: ids }));
    }
    function isFav(id) {
      const ids = getFavs();
      return ids.includes(Number(id));
    }
    function toggleFav(id) {
      id = Number(id);
      let ids = getFavs();
      if (ids.includes(id)) {
        ids = ids.filter(x => x !== id);
      } else {
        ids.push(id);
      }
      setFavs(ids);
      updateStarStates();
      return ids.includes(id);
    }
    function updateStarStates() {
      const ids = new Set(getFavs());
      document.querySelectorAll('[data-fav-btn]')?.forEach(btn => {
        const id = Number(btn.getAttribute('data-id'));
        const on = ids.has(id);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        const svg = btn.querySelector('svg');
        if (svg) {
          svg.classList.toggle('fill-yellow-400', on);
          svg.classList.toggle('fill-transparent', !on);
          svg.classList.toggle('stroke-yellow-500', on);
          svg.classList.toggle('stroke-slate-400', !on);
        }
      });
    }
    function bindFavButtons() {
      document.querySelectorAll('[data-fav-btn]')?.forEach((btn) => {
        if (btn._favBound) return;
        btn._favBound = true;
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          toggleFav(id);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateStarStates();
      bindFavButtons();
    });
    document.addEventListener('favorites:changed', () => {
      updateStarStates();
      bindFavButtons();
    });

    const TYPE_COLORS = {
      normal: '#a8a29e',
      fire: '#f97316',
      water: '#0ea5e9',
      grass: '#22c55e',
      ice: '#22d3ee',
      electric: '#eab308',
      psychic: '#ec4899',
      fighting: '#ef4444',
      poison: '#a855f7',
      ground: '#eab308',
      flying: '#6366f1',
      bug: '#84cc16',
      rock: '#a16207',
      ghost: '#8b5cf6',
      steel: '#64748b',
      dragon: '#7c3aed',
      dark: '#737373',
      fairy: '#e879f9',
    };

    function applyCardAmbient() {
      const cards = document.querySelectorAll('[data-pkm-card]');
      cards.forEach((card) => {
        const colorsAttr = card.getAttribute('data-colors') || '';
        const colorParts = colorsAttr
          .split(',')
          .map((c) => c.trim())
          .filter(Boolean);

        let c1 = colorParts[0] || null;
        let c2 = colorParts[1] || null;

        if (!c1 || !c2) {
          const typesAttr = card.getAttribute('data-types') || '';
          const types = typesAttr
            .split(',')
            .map((t) => t.trim().toLowerCase())
            .filter(Boolean);
          const primary = types[0] || null;
          const secondary = types[1] || null;

          if (!c1 && primary) {
            c1 = TYPE_COLORS[primary] || '#6366f1';
          }
          if (!c2) {
            if (secondary) {
              c2 = TYPE_COLORS[secondary] || c1 || '#9ca3af';
            } else {
              c2 = '#9ca3af';
            }
          }
        }

        if (!c1) c1 = '#6366f1';
        if (!c2) c2 = '#9ca3af';

        card.style.boxShadow = `
            0 0 0 3px ${c1},          /* outline principal */
            0 -18px 32px -10px ${c1}, /* glow superior */
            0 18px 32px -10px ${c2}   /* glow inferior */
          `;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyCardAmbient();
    });

    document.addEventListener('favorites:changed', () => {
      applyCardAmbient();
    });
  </script>
</body>

</html>
